                          h01LastPts = ptsUs
                          c.queueInputBuffer(idx, 0, data.size, ptsUs, 0)
                          h01Queued++'''),
              ('        pipeline.start()', '''        h01Stage = "pipeline.start"
                  pipeline.start()'''),
