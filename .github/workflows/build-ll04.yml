              }'''),
              ('Log.i("H01_LL01", msg)', 'Log.i("H01_LL02", msg)'),
              ('benchmarkLogCallback?.invoke("LL01: " + msg)', 'benchmarkLogCallback?.invoke("LL02: " + msg)'),
