name: Build AirPlay VI H01 LL04 connection stability

on:
  push:
    branches: [h01-ll04-connection-stability]
    paths:
      - "translations/**"
      - ".github/workflows/build-ll04.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airplay-server-vi-h01-ll04
  cancel-in-progress: false

jobs:
  build:
    name: Build Android 8.1 ARM32 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout Vietnamese translation
        uses: actions/checkout@v4

      - name: Get upstream AirPlay Server v0.0.30
        run: |
          git clone --depth 1 --branch v0.0.30 --recurse-submodules \
            https://github.com/jqssun/android-airplay-server.git upstream
          git -C upstream submodule update --init --recursive

      - name: Verify translation and use Vietnamese as default language
        run: |
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          en = Path("upstream/app/src/main/res/values/strings.xml")
          vi = Path("translations/strings_vi.xml")
          e = ET.parse(en).getroot()
          v = ET.parse(vi).getroot()
          def strings(root):
              return {s.get("name"): (s.text or "") for s in root.findall("string")}
          a, b = strings(e), strings(v)
          assert a.keys() == b.keys(), f"Key mismatch: missing={set(a)-set(b)}, extra={set(b)-set(a)}"
          assert len(a) == 145, f"Unexpected count: {len(a)}"
          pat = re.compile(r'%(?:\d+\$)?[ds]|%%')
          for key in a:
              assert sorted(pat.findall(a[key])) == sorted(pat.findall(b[key])), f"Bad formatting placeholder: {key}"
          array_e = e.find("./string-array[@name='audio_adaptive_step_names']")
          array_v = v.find("./string-array[@name='audio_adaptive_step_names']")
          assert array_e is not None and array_v is not None and len(list(array_e)) == len(list(array_v)) == 5
          import shutil
          shutil.copy2(vi, en)
          print(f"OK: {len(a)} translated strings and 5 list items")
          PY

      - name: Limit native binaries to ARM32 and allow side-by-side install
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("upstream/app/build.gradle.kts")
          s=p.read_text()
          before='val allAbis = listOf("arm64-v8a", "armeabi-v7a", "x86_64")'
          assert s.count(before)==1, "Unexpected upstream ABI declaration"
          s=s.replace(before,'val allAbis = listOf("armeabi-v7a")',1)
          debug='        debug {\n'
          assert s.count(debug)==1, "Unexpected debug build structure"
          s=s.replace(debug,'        debug {\n            applicationIdSuffix = ".vi.ll04"\n',1)
          p.write_text(s)
          PY

      - name: Apply LL01 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("upstream/app/src/main/kotlin/io/github/jqssun/airplay")
          def edit(path, pairs):
              p = base/path
              s = p.read_text()
              for old, new in pairs:
                  assert s.count(old) == 1, (path, old, s.count(old))
                  s = s.replace(old,new,1)
              p.write_text(s)
          edit("Prefs.kt", [
              ('    const val LOW_LATENCY =', '    const val H01_LL01 = "h01_ll01"; const val DEF_H01_LL01 = false\n    const val LOW_LATENCY =')
          ])
          edit("viewmodel/MainViewModel.kt", [
              ('    private val _lowLatency =', '''    private val _h01Ll01 = MutableStateFlow(prefs.getBoolean(Prefs.H01_LL01, Prefs.DEF_H01_LL01))
              val h01Ll01: StateFlow<Boolean> = _h01Ll01.asStateFlow()
          
              private val _lowLatency ='''),
              ('    fun setLowLatency(v: Boolean) {', '''    fun setH01Ll01(v: Boolean) {
                  _h01Ll01.value = v
                  prefs.edit().putBoolean(Prefs.H01_LL01, v).apply()
                  _applyByServerRestart()
              }
              fun setLowLatency(v: Boolean) {''')
          ])
          edit("ui/SettingsScreen.kt", [
              ('    val lowLatency by viewModel.lowLatency.collectAsState()', '    val h01Ll01 by viewModel.h01Ll01.collectAsState()\n    val lowLatency by viewModel.lowLatency.collectAsState()'),
              ('        if (developerOptions) {', '''        if (android.os.Build.VERSION.SDK_INT == 27) {
                      SettingSwitch(
                          title = "Độ trễ thấp được tối ưu riêng cho H01",
                          description = "LL01 thử nghiệm: H.264 Qualcomm, Decode Order. Có thể phải kết nối lại nếu không tương thích. Tắt để trở về chế độ gốc.",
                          checked = h01Ll01,
                          onCheckedChange = { viewModel.setH01Ll01(it) }
                      )
                  }
          
                  if (developerOptions) {''')
          ])
          edit("service/AirPlayService.kt", [
              ('        videoRenderer.lowLatency = lowLatency', '''        videoRenderer.lowLatency = lowLatency
                  videoRenderer.h01LowLatency = android.os.Build.VERSION.SDK_INT == 27 &&
                      prefs.getBoolean(Prefs.H01_LL01, Prefs.DEF_H01_LL01)'''),
              ('        prefs.getBoolean(Prefs.H265_ENABLED, Prefs.DEF_H265_ENABLED) && VideoRenderer.supportsH265()', '''        !(android.os.Build.VERSION.SDK_INT == 27 &&
                      prefs.getBoolean(Prefs.H01_LL01, Prefs.DEF_H01_LL01)) &&
                      prefs.getBoolean(Prefs.H265_ENABLED, Prefs.DEF_H265_ENABLED) && VideoRenderer.supportsH265()''')
          ])
          edit("renderer/VideoRenderer.kt", [
              ('    var lowLatency = true', '''    var lowLatency = true
              var h01LowLatency = false
              private var h01VendorActive = false
              private var h01Fallback = false
              private val h01Timing = LinkedHashMap<Long, Long>()
              private var h01DecodeTotalUs = 0L
              private var h01DecodeSamples = 0L
              private fun h01Log(msg: String) {
                  Log.i("H01_LL01", msg)
                  benchmarkLogCallback?.invoke("LL01: " + msg)
              }'''),
              ('        val msg = "fps=$fps', '''        val llStats = if (h01DecodeSamples > 0L)
                      " queue_to_output_avg_us=" + (h01DecodeTotalUs / h01DecodeSamples) +
                          " samples=" + h01DecodeSamples else ""
                  h01DecodeTotalUs = 0L
                  h01DecodeSamples = 0L
                  val msg = "fps=$fps'''),
              ('            "res=\${videoWidth}x\${videoHeight}"'.replace("\\$", "$"), '            "res=\${videoWidth}x\${videoHeight}" + llStats'.replace("\\$", "$")),
              ('            if (codec == null || isH265 != currentH265) {', '''            if (h01LowLatency && !isH265 && !h01Fallback && _hasBFrame(data)) {
                          h01Fallback = true
                          h01Log("B slice detected: disable experimental decode order; reconnect if video does not resume")
                          if (h01VendorActive) stopCodec()
                      }
          
                      if (codec == null || isH265 != currentH265) {'''),
              ('                Log.w(TAG, "Codec error, resetting", e)\n                stopCodec()', '''                Log.w(TAG, "Codec error, resetting", e)
                          if (h01VendorActive) {
                              h01Fallback = true
                              h01Log("Experimental decoder failed; next keyframe uses normal decoder. Reconnect if needed.")
                          }
                          stopCodec()'''),
              ('                c.queueInputBuffer(idx, 0, data.size, ntpTimeNs / 1000, 0)', '''                val ptsUs = ntpTimeNs / 1000
                          val queuedNs = System.nanoTime()
                          c.queueInputBuffer(idx, 0, data.size, ptsUs, 0)
                          if (benchmarkLog) {
                              h01Timing[ptsUs] = queuedNs
                              if (h01Timing.size > 256) h01Timing.remove(h01Timing.keys.first())
                          }'''),
              ('    private fun startCodec(h265: Boolean) {', '''    // Annex-B ordinary AVC slice headers: first_mb_in_slice, slice_type.
              // A B slice is evidence of reordering; absence is not a proof of no reordering.
              private fun _hasBFrame(data: ByteArray): Boolean {
                  var i = 0
                  while (i + 3 < data.size) {
                      if (data[i] != 0.toByte() || data[i + 1] != 0.toByte()) {
                          i++
                          continue
                      }
                      val header = when {
                          data[i + 2] == 1.toByte() -> i + 3
                          data[i + 2] == 0.toByte() && data[i + 3] == 1.toByte() -> i + 4
                          else -> { i++; continue }
                      }
                      if (header >= data.size) break
                      val type = data[header].toInt() and 31
                      if (type == 1 || type == 5) {
                          // Only read a small prefix; remove emulation-prevention bytes.
                          val rbsp = ByteArray(32)
                          var n = 0
                          var zeroes = 0
                          var j = header + 1
                          while (j < data.size && n < rbsp.size) {
                              val v = data[j++].toInt() and 255
                              if (zeroes >= 2 && v <= 1) break
                              if (zeroes >= 2 && v == 3) { zeroes = 0; continue }
                              rbsp[n++] = v.toByte()
                              zeroes = if (v == 0) zeroes + 1 else 0
                          }
                          var bit = 0
                          fun nextBit(): Int {
                              if (bit >= n * 8) return -1
                              val pos = bit++
                              return (rbsp[pos / 8].toInt() shr (7 - pos % 8)) and 1
                          }
                          fun ue(): Int {
                              var z = 0
                              while (true) {
                                  val b = nextBit()
                                  if (b < 0 || z > 24) return -1
                                  if (b == 1) break
                                  z++
                              }
                              var v = 1
                              repeat(z) {
                                  val b = nextBit()
                                  if (b < 0) return -1
                                  v = (v shl 1) or b
                              }
                              return v - 1
                          }
                          if (ue() >= 0) {
                              val slice = ue()
                              if (slice == 1 || slice == 6) return true
                          }
                      }
                      i = header + 1
                  }
                  return false
              }
          
              private fun startCodec(h265: Boolean) {'''),
              ('        val format = MediaFormat.createVideoFormat(mime, videoWidth, videoHeight)', '''        fun makeFormat(): MediaFormat {
                  val format = MediaFormat.createVideoFormat(mime, videoWidth, videoHeight)'''),
              ('        firstFrameQueued = false\n        try {\n            _startDecoder(MediaCodec.createDecoderByType(mime), format, s, h265)', '''        return format
                  }
                  val format = makeFormat()
                  firstFrameQueued = false
                  if (h01LowLatency && !h265 && !h01Fallback && android.os.Build.VERSION.SDK_INT == 27) {
                      try {
                          val experimentalFormat = makeFormat()
                          experimentalFormat.setInteger("vendor.qti-ext-dec-picture-order.enable", 1)
                          _startDecoder(MediaCodec.createByCodecName("OMX.qcom.video.decoder.avc"), experimentalFormat, s, false)
                          h01VendorActive = true
                          h01Log("Vendor Decode Order requested; codec started; driver acceptance NOT yet verified")
                          return
                      } catch (e: Exception) {
                          h01Fallback = true
                          h01Log("Experimental configure/start failed; use unmodified format: " + e.javaClass.simpleName)
                      }
                  }
                  try {
                      _startDecoder(MediaCodec.createDecoderByType(mime), format, s, h265)'''),
              ('        codec = null\n    }', '''        codec = null
                  h01VendorActive = false
                  h01Timing.clear()
              }'''),
              ('            if (idx < 0) break\n            _recordOutputFrameTime()', '''            if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED && h01VendorActive) {
                          val key = "vendor.qti-ext-dec-picture-order.enable"
                          val reported = try {
                              val output = c.outputFormat
                              if (output.containsKey(key)) output.getInteger(key).toString() else "not exposed"
                          } catch (_: Exception) { "unavailable" }
                          h01Log("Output format vendor key=" + reported + "; not a driver-level confirmation")
                          continue
                      }
                      if (idx < 0) break
                      if (benchmarkLog) {
                          h01Timing.remove(info.presentationTimeUs)?.let {
                              h01DecodeTotalUs += (System.nanoTime() - it) / 1000L
                              h01DecodeSamples++
                          }
                      }
                      _recordOutputFrameTime()'''),
              ('        pipeline.release()\n        fps =', '''        pipeline.release()
                  h01Fallback = false
                  h01DecodeTotalUs = 0L
                  h01DecodeSamples = 0L
                  fps =''')
          ])
          p = Path("upstream/app/src/main/res/values/strings.xml")
          s = p.read_text()
          import re
          s, n = re.subn(r'(<string name="app_name">)[^<]*(</string>)', r'\g<1>AirPlay VI H01 LL01\g<2>', s)
          assert n == 1
          p.write_text(s)
          print("LL01 source patch applied")
          PY

