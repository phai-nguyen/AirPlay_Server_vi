          edit(base/"service/AirPlayService.kt", [
              ('    val audioRenderer = AudioRenderer()', '''    val audioRenderer = AudioRenderer()
              @Volatile private var h01VideoOnly = true'''),
              ('        NativeBridge.nativeSetDefaultStreamValues(', '''        h01VideoOnly = prefs.getBoolean(Prefs.H01_VIDEO_ONLY, Prefs.DEF_H01_VIDEO_ONLY)
                  if (!h01VideoOnly) NativeBridge.nativeSetDefaultStreamValues('''),
