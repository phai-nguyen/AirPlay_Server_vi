              ('        val advertiseAudio = prefs.getBoolean(Prefs.ADVERTISE_AUDIO, Prefs.DEF_ADVERTISE_AUDIO)', '        val advertiseAudio = !h01VideoOnly && prefs.getBoolean(Prefs.ADVERTISE_AUDIO, Prefs.DEF_ADVERTISE_AUDIO)'),
              ('        if (prefs.getBoolean(Prefs.ADVERTISE_AUDIO, Prefs.DEF_ADVERTISE_AUDIO)) {', '        if (advertiseAudio) {'),
              ('        NativeBridge.nativeSetCodecs(nativeHandle, alac, aac)', '''        // Keep codec TXT bits for sender compatibility; audio feature and RAOP advertisement are disabled below.
                  NativeBridge.nativeSetCodecs(nativeHandle, alac, aac)'''),
              ('        videoRenderer.benchmarkLog = prefs.getBoolean(Prefs.BENCHMARK_LOG, Prefs.DEF_BENCHMARK_LOG)', '        videoRenderer.benchmarkLog = true'),
              ('    override fun onAudioFormat(ct: Int, spf: Int, usingScreen: Boolean) {\n        clearPin()', '''    override fun onAudioFormat(ct: Int, spf: Int, usingScreen: Boolean) {
                  if (h01VideoOnly) {
                      log("LL02: ignored audio format ct=" + ct + " spf=" + spf + " screen=" + usingScreen)
                      return
