              val h01VideoOnly: StateFlow<Boolean> = _h01VideoOnly.asStateFlow()
          
              private val _h01Ll01 ='''),
              ('    fun setH01Ll01(v: Boolean) {', '''    fun setH01VideoOnly(v: Boolean) {
                  _h01VideoOnly.value = v
                  prefs.edit().putBoolean(Prefs.H01_VIDEO_ONLY, v).apply()
                  _applyByServerRestart()
              }
              fun setH01Ll01(v: Boolean) {'''),
