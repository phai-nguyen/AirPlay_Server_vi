              ('                Log.w(TAG, "Codec error, resetting", e)', '''                h01Error(e)
                          Log.w(TAG, "Codec error, resetting", e)'''),
              ('            val idx = c.dequeueInputBuffer(FEED_WAIT_US)', '''            h01Stage = "dequeueInputBuffer"
                      h01InputBytes = data.size
                      h01InputIndex = -1
                      h01InputCapacity = -1
                      val idx = c.dequeueInputBuffer(FEED_WAIT_US)
                      h01InputIndex = idx
                      if (idx < 0) h01InputWaits++'''),
              ('                val buf = c.getInputBuffer(idx) ?: return\n                buf.clear()\n                buf.put(data)', '''                h01Stage = "getInputBuffer"
                          val buf = c.getInputBuffer(idx) ?: error("Null input buffer")
                          buf.clear()
