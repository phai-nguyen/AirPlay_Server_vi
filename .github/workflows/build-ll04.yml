                  _logList.joinToString("\\n", postfix = "\\n")
              }
          
              fun saveLogsToH01() {
                  val ctx = getApplication<Application>()
                  val snapshot = logText()
                  viewModelScope.launch {
                      val result = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                          runCatching {
                              val dir = ctx.getExternalFilesDir("H01-LL02")
                                  ?: File(ctx.filesDir, "H01-LL02")
                              check(dir.isDirectory || dir.mkdirs()) { "Cannot create log directory" }
                              val file = File(dir, "log.txt")
                              file.writeText(snapshot, Charsets.UTF_8)
                              file.absolutePath
                          }
                      }
                      val msg = result.fold(
                          { "Đã lưu: " + it },
                          { "Không lưu được log: " + it.message }
                      )
                      addLog(msg)
                      android.widget.Toast.makeText(ctx, msg, android.widget.Toast.LENGTH_LONG).show()
                  }
              }
          
              fun saveLogsToUri(uri: android.net.Uri) {
                  val ctx = getApplication<Application>()
                  val snapshot = logText()
                  viewModelScope.launch {
                      val result = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                          runCatching {
                              val stream = ctx.contentResolver.openOutputStream(uri, "wt")
                                  ?: error("Cannot open output stream")
                              stream.use { it.write(snapshot.toByteArray(Charsets.UTF_8)) }
                          }
                      }
                      val msg = result.fold(
                          { "Đã xuất log.txt" },
                          { "Không xuất được: " + it.message }
                      )
                      addLog(msg)
                      android.widget.Toast.makeText(ctx, msg, android.widget.Toast.LENGTH_LONG).show()
                  }
              }
          
              fun exportLogs() {'''),
              ('val file = File(ctx.cacheDir, "airplay_logs.txt")\n        file.writeText(_logList.joinToString("\\n"))', 'val file = File(ctx.cacheDir, "log.txt")\n        file.writeText(logText(), Charsets.UTF_8)'),
              ('            persistLogsLocked()\n            snapshot = _logList.toList()', '''            // Keep UI history bounded, avoid rewriting the whole file on every event.
                      runCatching {
                          if (logFile.length() > 1024 * 1024) persistLogsLocked()
                          else logFile.appendText(line + "\\n")
