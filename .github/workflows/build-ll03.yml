          assert n==1
          p.write_text(s)
          edit(base/"renderer/VideoRenderer.kt", [
              ('    private var h01VendorActive = false', '''    private var h01Stage = "idle"
              private var h01InputIndex = -1
              private var h01OutputIndex = -1
              private var h01InputCapacity = -1
              private var h01InputBytes = 0
              private var h01Queued = 0L
              private var h01Output = 0L
              private var h01InputWaits = 0L
              private var h01NoOutput = 0L
              private var h01LastPts = 0L
              private var h01VendorActive = false'''),
              ('    private var h01Fallback = false', '''    private var h01Fallback = false
              private fun h01Error(e: Exception) {
                  val detail = if (e is MediaCodec.CodecException)
                      " code=" + e.errorCode + " hex=0x" + Integer.toHexString(e.errorCode) +
                      " diagnostic=" + e.diagnosticInfo + " recoverable=" + e.isRecoverable +
                      " transient=" + e.isTransient
                  else ""
                  h01Log("ERROR stage=" + h01Stage + " exception=" + e.javaClass.name +
                      " message=" + e.message + detail + " codec=" + codecName +
                      " vendorRequested=" + h01VendorActive + " res=" + videoWidth + "x" + videoHeight +
                      " inputIndex=" + h01InputIndex + " capacity=" + h01InputCapacity +
                      " inputBytes=" + h01InputBytes + " outputIndex=" + h01OutputIndex +
                      " queued=" + h01Queued + " output=" + h01Output +
