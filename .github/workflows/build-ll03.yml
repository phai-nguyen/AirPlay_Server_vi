                              val dir = android.os.Environment.getExternalStoragePublicDirectory(
                                  android.os.Environment.DIRECTORY_DOWNLOADS)'''),
              ('            logFile.writeText(_logList.joinToString("\\n"))', '            logFile.writeText(_logList.joinToString("\\n", postfix = "\\n"))')
          ])
          edit(base/"ui/LogsScreen.kt", [
              ('    val saveDocument = androidx.activity.compose.rememberLauncherForActivityResult(', '''    val storagePermission = androidx.activity.compose.rememberLauncherForActivityResult(
                  androidx.activity.result.contract.ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) viewModel.saveLogsToH01()
                  else android.widget.Toast.makeText(ctx, "Chưa cấp quyền bộ nhớ. Dùng Chọn nơi lưu.", android.widget.Toast.LENGTH_LONG).show()
              }
              val saveDocument = androidx.activity.compose.rememberLauncherForActivityResult('''),
              ('''            TextButton(onClick = { viewModel.saveLogsToH01() }) { Text("Lưu log.txt") }''', '''            TextButton(onClick = {
                          if (android.os.Build.VERSION.SDK_INT > 28) {
                              try { saveDocument.launch("log.txt") }
                              catch (_: Exception) {
                                  android.widget.Toast.makeText(ctx, "Không có trình chọn tệp.", android.widget.Toast.LENGTH_LONG).show()
                              }
                          } else if (androidx.core.content.ContextCompat.checkSelfPermission(
                              ctx, android.Manifest.permission.WRITE_EXTERNAL_STORAGE
