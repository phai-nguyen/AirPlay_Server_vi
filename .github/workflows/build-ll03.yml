      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Android SDK and NDK using runner SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK (signed with test debug key)
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp upstream/app/build/outputs/apk/debug/app-debug.apk dist/AirPlay_Server_VI_H01_LL03.apk
          sha256sum dist/AirPlay_Server_VI_H01_LL03.apk | tee dist/SHA256.txt
          cat > dist/README_VI.txt <<'TXT'
          AirPlay Server VI — bản thử nghiệm cho ZEUS H01
          Android 8.1 / ARM32 / upstream v0.0.30
          APK được ký bằng khóa debug của GitHub runner; không phải bản chính thức.
          Có thể cài song song với bản gốc, nhưng hãy tắt bản gốc trước khi mở bản VI.
          LL03: mặc định chỉ hình ảnh, Decode Order bật, operating-rate tắt. Giữ sáng theo phiên phản chiếu; lưu Download/log.txt. Không sửa firmware.
          TXT

      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay_Server_VI_H01_LL03_APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
