      - name: Apply LL03 screen and Download changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("upstream/app/src/main")
          base = root/"kotlin/io/github/jqssun/airplay"
          def edit(p,pairs):
              s=p.read_text()
              for old,new in pairs:
                  assert s.count(old)==1,(str(p),old,s.count(old))
                  s=s.replace(old,new,1)
              p.write_text(s)
          
          edit(base/"Prefs.kt", [
              ('const val DEF_H01_LL01 = false', 'const val DEF_H01_LL01 = true'),
              ('const val DEF_KEY_OPERATING_RATE = true', 'const val DEF_KEY_OPERATING_RATE = false')
          ])
          edit(root/"AndroidManifest.xml", [
              ('    <uses-permission android:name="android.permission.WAKE_LOCK" />', '''    <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />''')
          ])
          edit(base/"MainActivity.kt", [
              ('''                combine(viewModel.keepScreenOn, viewModel.connectionCount) { keep, conns ->
                              keep && conns > 0
                          }.collect { on ->''', '''                combine(viewModel.keepScreenOn, viewModel.connectionCount,
                              viewModel.mirroringActive, viewModel.videoPlaybackActive) { keep, conns, mirror, video ->
                              keep && (conns > 0 || mirror || video)
                          }.collect { on ->
                              viewModel.addLog("LL03 POWER windowKeepScreenOn=" + on)'''),
              ('    override fun onStop() {\n        super.onStop()', '''    override fun onStart() {
                  super.onStart()
                  viewModel.addLog("LL03 POWER Activity.onStart")
              }
          
              override fun onStop() {
                  viewModel.addLog("LL03 POWER Activity.onStop changingConfig=" + isChangingConfigurations +
                      " connections=" + viewModel.connectionCount.value)
                  super.onStop()''')
          ])
          edit(base/"service/AirPlayService.kt", [
              ('import kotlinx.coroutines.flow.debounce', 'import kotlinx.coroutines.flow.debounce\nimport kotlinx.coroutines.flow.combine'),
              ('    private var wakeLock: PowerManager.WakeLock? = null', '''    private var wakeLock: PowerManager.WakeLock? = null
              private var displayWakeLock: PowerManager.WakeLock? = null
              private var screenEventsRegistered = false
              private val keepScreenPrefListener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  if (key == Prefs.KEEP_SCREEN_ON) _mainHandler.post { syncDisplayWakeLock() }
              }
          
              private val screenEvents = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      log("LL03 POWER event=" + intent.action + " interactive=" + pm.isInteractive +
                          " displayLock=" + (displayWakeLock?.isHeld == true) +
                          " mirror=" + _mirroringActive.value + " connections=" + _connectionCount.value)
                  }
              }
          
              // Oreo legacy display lock: hold only during video session; never force wake/re-wake.
              @Suppress("DEPRECATION")
              private fun syncDisplayWakeLock() {
                  val hold = Build.VERSION.SDK_INT <= 28 &&
                      _serverState.value == ServerState.RUNNING && _connectionCount.value > 0 &&
                      (_mirroringActive.value || _videoPlaybackActive.value) &&
                      prefs.getBoolean(Prefs.KEEP_SCREEN_ON, Prefs.DEF_KEEP_SCREEN_ON)
                  if (!hold) {
                      releaseDisplayWakeLock()
                      return
                  }
                  if (displayWakeLock?.isHeld == true) return
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val lock = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK, "airplay:h01-display")
                      lock.setReferenceCounted(false)
                      lock.acquire()
                      displayWakeLock = lock
                      log("LL03 POWER displayLock acquired interactive=" + pm.isInteractive)
                  } catch (e: Exception) {
                      log("LL03 POWER displayLock failed: " + e.javaClass.name + " " + e.message)
                  }
              }
          
              private fun releaseDisplayWakeLock() {
                  val lock = displayWakeLock ?: return
                  displayWakeLock = null
                  try {
                      if (lock.isHeld) lock.release()
                      log("LL03 POWER displayLock released")
                  } catch (e: Exception) {
                      log("LL03 POWER release failed: " + e.message)
                  }
              }'''),
              ('        createNotificationChannel()\n        dacpController', '''        createNotificationChannel()
                  prefs.registerOnSharedPreferenceChangeListener(keepScreenPrefListener)
                  try {
                      ContextCompat.registerReceiver(this, screenEvents, IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_SCREEN_OFF)
                      }, ContextCompat.RECEIVER_NOT_EXPORTED)
                      screenEventsRegistered = true
                  } catch (e: Exception) {
                      log("LL03 POWER screen receiver failed: " + e.message)
                  }
                  lifecycleScope.launch {
                      combine(_serverState, _connectionCount, _mirroringActive, _videoPlaybackActive) { _, _, _, _ -> Unit }
                          .collect { syncDisplayWakeLock() }
                  }
                  dacpController'''),
              ('    private fun _failStart() {\n        audioRenderer.detachEngine()', '''    private fun _failStart() {
                  releaseDisplayWakeLock()
                  audioRenderer.detachEngine()'''),
              ('    fun stopServer() {\n        audioRenderer.detachEngine()', '''    fun stopServer() {
                  releaseDisplayWakeLock()
                  audioRenderer.detachEngine()'''),
              ('    override fun onDestroy() {\n        stopServer()', '''    override fun onDestroy() {
                  prefs.unregisterOnSharedPreferenceChangeListener(keepScreenPrefListener)
                  if (screenEventsRegistered) {
                      try { unregisterReceiver(screenEvents) } catch (_: Exception) {}
                      screenEventsRegistered = false
                  }
                  stopServer()'''),
              ('    fun setVideoSurface(surface: Surface) {\n        videoRenderer.setSurface(surface)', '''    fun setVideoSurface(surface: Surface) {
                  log("LL03 POWER mirror Surface available valid=" + surface.isValid)
                  videoRenderer.setSurface(surface)'''),
              ('    fun clearVideoSurface(surface: Surface) {\n        videoRenderer.clearSurface(surface)', '''    fun clearVideoSurface(surface: Surface) {
                  log("LL03 POWER mirror Surface destroyed valid=" + surface.isValid)
                  videoRenderer.clearSurface(surface)''')
          ])
